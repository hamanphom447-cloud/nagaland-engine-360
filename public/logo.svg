<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#dc2626" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Red border -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#dc2626" stroke-width="6" opacity="0.5"/>
  <!-- "NE" text -->
  <text x="180" y="280" font-family="Arial, sans-serif" font-size="200" font-weight="900" font-style="italic">
    <tspan fill="#ffffff">N</tspan><tspan fill="#dc2626">E</tspan>
  </text>
  <!-- 360 badge circle -->
  <circle cx="340" cy="180" r="48" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="340" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#dc2626">360</text>
  <!-- Hornbill-style icon (simplified) -->
  <g transform="translate(256, 380)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#dc2626" opacity="0.8"/>
    <!-- Beak -->
    <path d="M 35 -5 L 70 -10 L 70 5 L 35 8 Z" fill="#f59e0b" opacity="0.9"/>
    <!-- Crest feather -->
    <path d="M -10 -15 L -5 -40 L 5 -35 L 0 -12 Z" fill="#dc2626" opacity="0.7"/>
    <!-- Eye -->
    <circle cx="20" cy="-5" r="3" fill="#000"/>
  </g>
  <!-- Tagline -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#a1a1aa">360° View of Nagaland</text>
</svg>
